# GitHub git host of the NERV release extension (contract: docs/extensions.md
# and internal/deployprovider). gh runs in nerv-release deploy's clone of
# origin, so it releases origin's GitHub repository with the user's `gh
# auth login` session.
#
# Ported from nerv's plugins/release-github/provider.yaml as-is (no native
# nerv-release dispatch: every operation is a plain gh invocation).
name: github
extension: release
slot: host
contract_version: 1
runtime: exec
requires: [gh]
operations:
  releaseExists:
    - argv: [gh, release, view, "{tag}"]
      absent_stderr: "release not found"
  createRelease:
    - argv:
        - gh
        - release
        - create
        - "{tag}"
        - --title
        - "{tag}"
        - --notes-file
        - "{notes_file}"
        - {arg: --prerelease, when: prerelease}
        - --verify-tag
