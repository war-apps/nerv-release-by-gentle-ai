# The release extension's contract with the NERV core (nerv's
# docs/extensions.md). The core runs nerv-release version next (and,
# later, nerv-release build and deploy), which calls the version and
# build providers with the common envelope (the payloads and answers are
# in internal/releaseplan/contract.go).
#
# This is still a minimal manifest: only the version slot is wired up
# (U2), and the target slot only far enough for U3's config layer to
# discover release-ssh-compose's scope: user keys (deployconfig, the
# deploy run itself and the host slot are U4/U5 work; they are not in
# this manifest yet, so loading it never offers a build or host provider
# it cannot run).
name: release
contract_version: 1
suggest_order: 2
# Every release provider is installed with release, never asked.
providers: bundled
runtime: exec
argv: ["{nerv-release}", release]
slots:
  # The version engine (release.version): the next version, channel, tag,
  # notes and CHANGELOG section of each project on a branch;
  # conventional-commits when release.version names none.
  - name: version
    cardinality: one
    default: conventional-commits
    operations:
      validate: optional
      next: required
      branch: required
      import: optional
  # One provider per deploy.targets entry, run in that order (U4 runs
  # them; this slot exists now so release-ssh-compose's manifest, and its
  # scope: user config keys, can be loaded).
  - name: target
    cardinality: per-target
    operations:
      preflight: optional
      publish: optional
      deploy: required
      verify: optional
